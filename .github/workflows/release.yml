name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v0.0.2'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Validate version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Prepare release description
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          source = Path('release') / f"{os.environ['VERSION']}.md"
          lines = source.read_text(encoding='utf-8').splitlines(keepends=True)
          if lines and lines[0].startswith('# '):
              lines.pop(0)
          while lines and not lines[0].strip():
              lines.pop(0)
          body = ''.join(lines)
          if not body.strip():
              raise SystemExit(f'Release notes are empty: {source}')
          (Path(os.environ['RUNNER_TEMP']) / 'release-notes.md').write_text(body, encoding='utf-8')
          PY
      - name: Import Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE" && test -n "$CERTIFICATE_PASSWORD"
          KEYCHAIN="$RUNNER_TEMP/macduo-signing.keychain-db"
          PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$PASSWORD"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          # codesign also uses the user search list to resolve the certificate chain.
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application:/{print $2}')
          [[ "$IDENTITY" =~ ^[0-9A-Fa-f]{40}$ ]] || { echo 'Expected exactly one Developer ID Application identity'; exit 1; }
          echo "CODE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Build, sign, notarize and package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./scripts/package-release.sh
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacDuo-${{ env.VERSION }}
          path: dist/release/*
          if-no-files-found: error
      - name: Create or update draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "dist/release/MacDuo-${VERSION}-universal.zip"
            "dist/release/MacDuo-${VERSION}-universal.dmg"
            "dist/release/SHA256SUMS.txt"
          )
          for asset in "${assets[@]}"; do
            test -s "$asset" || { echo "Missing release asset: $asset"; exit 1; }
          done
          (cd dist/release && shasum -a 256 -c SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || { echo 'Refusing to replace a published release'; exit 1; }
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --title "MacDuo $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --notes-file "$RUNNER_TEMP/release-notes.md" --title "MacDuo $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/macduo-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/signing.p12"
